name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  visual-regression:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run visual regression smoke
        run: |
          MARKER="tests/catalog-visual.spec.js-snapshots/.linux-docker-baseline"
          if [ ! -f "$MARKER" ] && [ "${{ github.ref }}" = "refs/heads/master" ] && [ "${{ github.event_name }}" = "push" ]; then
            npx playwright test --grep @smoke --update-snapshots
            touch "$MARKER"
          else
            npm run test:smoke
          fi
        env:
          CI: true

      - name: Commit bootstrapped baselines
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/catalog-visual.spec.js-snapshots/
          git diff --staged --quiet || git commit -m "Bootstrap Linux Docker visual baselines"
          git push

      - name: Build visual summary
        if: always()
        run: npm run report:summary

      - name: Upload visual regression reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-reports
          path: |
            playwright-report/
            reports/
          if-no-files-found: ignore
