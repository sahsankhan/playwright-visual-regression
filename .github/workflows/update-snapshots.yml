name: Update Snapshots

on:
  workflow_dispatch:

jobs:
  update-snapshots:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Regenerate smoke baselines
        run: npx playwright test --grep @smoke --update-snapshots
        env:
          CI: true
          NODE_OPTIONS: --dns-result-order=ipv4first

      - name: Commit updated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/catalog-visual.spec.js-snapshots/
          git diff --staged --quiet || git commit -m "Update Linux visual baselines from GitHub Actions"
          git push
