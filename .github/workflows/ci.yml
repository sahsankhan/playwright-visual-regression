name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  visual-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate Linux baselines if missing
        if: hashFiles('tests/catalog-visual.spec.js-snapshots/home-catalog-linux.png') == ''
        run: npx playwright test --grep @smoke --update-snapshots
        env:
          CI: true

      - name: Run visual regression smoke
        run: npm run test:smoke
        env:
          CI: true

      - name: Commit Linux baselines
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/catalog-visual.spec.js-snapshots/
          if git diff --staged --quiet; then
            echo "No snapshot changes to commit"
          else
            git commit -m "Add Linux visual baselines from GitHub Actions"
            git push
          fi

      - name: Build visual summary
        if: always()
        run: npm run report:summary

      - name: Upload visual regression reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-reports
          path: |
            playwright-report/
            reports/
            test-results/
          if-no-files-found: ignore
